[project]
name = "soccer-stats"
version = "0.1.0"
description = "Soccer match models for finding value against bookmaker odds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]

[project.scripts]
soccer-stats = "soccer_stats.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_stats"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
