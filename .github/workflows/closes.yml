# Starts publish.yml shortly before each cluster of kickoffs, so the team-total and corner
# close snapshots (and the match trades' last DraftKings price) are taken inside their
# 30-minute window. GitHub throttles scheduled runs (10-12 Oct 2026: 18 scheduled publish
# runs in two days, gaps up to 6.5 h), but a workflow_dispatch starts within a minute or two.
# The dispatched publish is an ordinary run: no extra calls per snapshot, every cap,
# reserve and call record unchanged (src/soccer_stats/close_runs.py).
# Since 18 Oct it also dispatches one publish 2 h 15 min after each cluster of kickoffs,
# so the paper step settles those trades from ESPN's final scores (free) right after full
# time; DraftKings refreshes in that run still follow the per-league refresh floors.
# Since 28 Oct it also dispatches inplay.yml at each cluster's first kickoff + 58 and + 78
# minutes: the half-time in-play snapshots (close_runs.INPLAY, inplay_log.py).
name: Close snapshots

on:
  schedule:
    # A safety net: a planner run hands over to the next one itself at its horizon (see
    # the last step), so these only restart the chain if a hand-over is lost.
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write # dispatch publish.yml, inplay.yml, caches.yml and the next planner run
  contents: read

# One planner at a time. A new run waits for the sleeping one rather than cancelling it.
concurrency:
  group: closes
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04  # pinned 24 Oct: ubuntu-latest moved to 26.04 (Python 3.14, no Playwright Chromium)
    timeout-minutes: 350 # GitHub stops any job at 6 h; the plan covers 5.5 h
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Read the coming kickoffs (data-log)
        run: |
          mkdir -p "$RUNNER_TEMP/odds_log"
          git fetch --depth=1 origin data-log || { echo "no data-log yet"; exit 0; }
          this=$(date -u +%Y-%m)
          next=$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m)
          for f in $(git ls-tree --name-only FETCH_HEAD odds_log/ | grep -E "_(${this}|${next})\.jsonl$"); do
            git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/odds_log/$(basename "$f")"
          done
          ls "$RUNNER_TEMP/odds_log" | wc -l

      - name: Plan the close runs
        run: |
          uv sync --frozen
          uv run soccer-stats close-plan --log-dir "$RUNNER_TEMP/odds_log" --out "$RUNNER_TEMP/plan.json"

      # Only the default branch dispatches (a manual run elsewhere just prints the plan).
      # Publish heartbeat (lead, 9 Nov; close_runs.HEARTBEAT): every sleep is cut into
      # 5-minute steps, and at each step publish.yml is dispatched when its newest run on
      # this branch was created 75 minutes or more ago (cron skipped it for 6.5 h on 9 Nov).
      # The run then sleeps to its horizon and always hands over to the next planner run,
      # so the heartbeat keeps going on days without kickoffs.
      # Caches heartbeat (lead, 12 Nov; close_runs.CACHES_HEARTBEAT): about hourly, caches.yml
      # is dispatched with its defaults when its newest run on this branch that was not
      # cancelled was created 84 h or more ago (GitHub dropped the 04:23 cron on 12 Nov).
      - name: Dispatch publish at each planned time
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          plan="$RUNNER_TEMP/plan.json"
          heartbeat() {
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?branch=$REF&per_page=1" \
              --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || echo "?")
            if [ "$last" = "?" ]; then echo "Heartbeat: could not read publish runs"; return 0; fi
            if [ "$(uv run --frozen soccer-stats publish-heartbeat --last "$last")" = "due" ]; then
              if gh workflow run publish.yml --ref "$REF" < /dev/null; then
                echo "Heartbeat: dispatched publish.yml at $(date -u +%Y-%m-%dT%H:%M:%SZ) (last run ${last:-none})"
              else
                echo "Heartbeat: dispatch of publish.yml failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              fi
            fi
          }
          caches_checked=0
          caches_heartbeat() {
            now=$(date +%s)
            if [ $(( now - caches_checked )) -lt 3600 ]; then return 0; fi
            caches_checked=$now
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/caches.yml/runs?branch=$REF&per_page=30" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0].created_at // ""' 2>/dev/null || echo "?")
            if [ "$last" = "?" ]; then echo "Heartbeat: could not read caches runs"; return 0; fi
            if [ "$(uv run --frozen soccer-stats publish-heartbeat --workflow caches --last "$last")" = "due" ]; then
              ago="none"
              if [ -n "$last" ]; then ago="$(( (now - $(date -d "$last" +%s)) / 3600 ))h ago"; fi
              if gh workflow run caches.yml --ref "$REF" < /dev/null; then
                echo "Heartbeat: dispatched caches.yml (last run $ago)"
              else
                echo "Heartbeat: dispatch of caches.yml failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              fi
            fi
          }
          sleep_until() {
            while :; do
              heartbeat
              caches_heartbeat
              left=$(( $1 - $(date +%s) ))
              if [ "$left" -le 0 ]; then return 0; fi
              if [ "$left" -gt 300 ]; then sleep 300; else sleep "$left"; return 0; fi
            done
          }
          jq -r '.dispatch[] | "\(.epoch) \(.workflow // "publish.yml")"' "$plan" > "$RUNNER_TEMP/dispatch.txt"
          while read -r at wf; do
            sleep_until "$at"
            if gh workflow run "$wf" --ref "$REF" < /dev/null; then
              echo "Dispatched $wf at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              echo "Dispatch of $wf failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fi
          done < "$RUNNER_TEMP/dispatch.txt"
          sleep_until "$(jq -r '.horizon_end.epoch' "$plan")"
          gh workflow run closes.yml --ref "$REF" && echo "Next planner run requested"
