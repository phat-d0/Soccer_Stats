# Diagnostics and edge research, run by hand only. Never pushes and never deploys:
# results are in the job log (and a short-lived workflow artifact).
#   coverage: what the cached player-odds history holds and which books price player
#             shots (about 40-80 credits; the original check).
#   props:    which books price BOTH sides of EPL player shots, live and historical,
#             stopping at `cap` credits (0 = dry run). See docs/edge.md.
#   match:    line shopping on football-data prices with the walk-forward match model
#             (no credits).
#   shots:    Understat's shot counts vs football-data (team) and ESPN (player); no credits.
#   lab:      the research lab's 1X2 model bake-off on development seasons (docs/lab.md);
#             the 2025/26 holdout stays locked. No credits.
#   lab-holdout: opens the locked holdout once for `finalists` (and `stack_base`), with
#             `reason` printed and the time it was opened. No credits.
#   goalscorer: the anytime-goalscorer stage-0 live probe and 5-match pilot
#             (docs/player_props.md), never past `cap` credits (0 = no calls); prints
#             the books, margins, name matches, measures and the pre-registered verdict.
#   goal-lab: the goalscorer model improvements (docs/player_props.md section 8),
#             development seasons; `reason` opens the locked 2026/27 forward window
#             (once, logged). No credits.
#   player-lab: the priced player shot lines (data-log) through the lab's metrics,
#             development seasons only (no credits).
#   signals:  free signals (xG form, rest, model, soft books) vs Pinnacle's early-to-close
#             move and as blend inputs (no credits).
name: Player odds check

on:
  workflow_dispatch:
    inputs:
      task:
        description: "coverage, props, match, shots, signals, lab, lab-holdout, goalscorer, player-lab or goal-lab"
        type: choice
        options: [coverage, props, match, shots, signals, lab, lab-holdout, goalscorer, player-lab, goal-lab]
        default: coverage
      cap:
        description: "props / goalscorer: most credits to spend (0 = dry run)"
        default: "0"
      hist_dates:
        description: "props: historical dates (comma-separated ISO times)"
        default: "2026-10-03T08:00:00Z,2025-03-15T08:00:00Z"
      seasons:
        description: "match/signals: seasons to bet (start years); shots: seasons to load"
        default: "2017-2025"
      league:
        description: "lab/lab-holdout: football-data division (E0, E1, E2, E3)"
        default: "E0"
      reason:
        description: "lab-holdout / goal-lab: why the holdout (goal-lab: the forward window) is opened (logged)"
        default: ""
      finalists:
        description: "lab-holdout: comma-separated candidates, e.g. a_dixon_coles,c_gbm,e_stack"
        default: ""
      stack_base:
        description: "lab-holdout: the stack's base candidate (one of the finalists)"
        default: ""

permissions:
  contents: read
  actions: read  # goal-lab reads the round-5 pilot's job log

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/player_odds_history
          key: player-odds-history-none
          restore-keys: player-odds-history-
      # Restore only: this job never saves a cache, so it can't disturb the paid ones.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task != 'coverage' && inputs.task != 'props' }}
        with:
          path: data/raw
          key: raw-data-none
          restore-keys: raw-data-
      - name: Run
        env:
          ODDS_API_KEY: ${{ (inputs.task == 'coverage' || inputs.task == 'props' || inputs.task == 'goalscorer') && secrets.ODDS_API_KEY || '' }}
          TASK: ${{ inputs.task }}
          CAP: ${{ inputs.cap }}
          HIST_DATES: ${{ inputs.hist_dates }}
          SEASONS: ${{ inputs.seasons }}
          LEAGUE: ${{ inputs.league }}
          REASON: ${{ inputs.reason }}
          FINALISTS: ${{ inputs.finalists }}
          STACK_BASE: ${{ inputs.stack_base }}
        run: |
          uv sync --frozen
          mkdir -p out
          case "$TASK" in
            coverage) uv run soccer-stats player-odds-check ;;
            props) uv run python -m soccer_stats.edge.run props --cap "$CAP" \
                     --hist-dates "$HIST_DATES" --json out/props.json ;;
            match) uv run python -m soccer_stats.edge.run match --seasons "$SEASONS" \
                     --json out/match.json ;;
            signals) uv run python -m soccer_stats.edge.run signals --seasons "$SEASONS" \
                     --json out/signals.json ;;
            lab) uv run python -m soccer_stats.lab.run --league "$LEAGUE" \
                     --json out/lab_dev.json ;;
            lab-holdout) uv run python -m soccer_stats.lab.run --league "$LEAGUE" --open-holdout \
                     --reason "$REASON" --finalists "$FINALISTS" --stack-base "$STACK_BASE" \
                     --json out/lab_holdout.json ;;
            goalscorer) uv run soccer-stats goalscorer-pilot --cap "$CAP" \
                     --json out/goalscorer_pilot.json ;;
            goal-lab)
              GH_TOKEN="${{ github.token }}" gh api \
                "repos/${{ github.repository }}/actions/jobs/112639640656/logs" > out/pilot.log \
                || echo "pilot log not available"
              uv run soccer-stats goal-lab --pilot-log out/pilot.log \
                --open-forward "$REASON" --json out/goal_lab.json
              rm -f out/pilot.log ;;
            player-lab)
              git fetch --depth=1 origin data-log
              git show FETCH_HEAD:backtest/E0_player_lines.csv.gz > out/lines.csv.gz
              git show FETCH_HEAD:backtest/E0_players.json > out/players.json
              uv run soccer-stats player-lab --lines out/lines.csv.gz \
                --players-json out/players.json --json out/player_lab.json
              rm out/lines.csv.gz out/players.json ;;
            shots) uv run python -m soccer_stats.edge.run shots --seasons "$SEASONS" \
                     --json out/shots.json ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-${{ inputs.task }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
