# Diagnostics and edge research, run by hand only. Never pushes and never deploys:
# results are in the job log (and a short-lived workflow artifact).
#   coverage: what the cached player-odds history holds and which books price player
#             shots (about 40-80 credits; the original check).
#   props:    which books price BOTH sides of EPL player shots, live and historical,
#             stopping at `cap` credits (0 = dry run). See docs/edge.md.
#   match:    line shopping on football-data prices with the walk-forward match model
#             (no credits).
#   shots:    Understat's shot counts vs football-data (team) and ESPN (player); no credits.
#   lab:      the research lab's 1X2 model bake-off on development seasons (docs/lab.md);
#             the 2025/26 holdout stays locked. No credits.
#   lab-edge: the live model's learned minimum edge at Pinnacle early for `league`
#             (candidate a only, development seasons; no model selection).
#   lineups: lineup surprises vs Pinnacle's early-to-close move for `league` (E0, SP1,
#            D1, I1, F1; docs/lab.md round 8). Downloads Understat match rosters.
#   totals: corners, goal lines 0.5-5.5 and team totals for `league` (E0, SP1, D1,
#           I1, F1, E1; docs/totals.md). football-data and Understat only.
#   corners: the round-11 corners bake-off for `league` (docs/totals.md): development
#            2017/18-2023/24; with `reason` and `finalists` ("total=<x>,team=<y>") it
#            opens the 2024/25 holdout once instead. football-data only, no key.
#   corners2: corners bake-off 2 for `league` (docs/totals.md, round 13): development
#            2017/18-2023/24; `reason` + `finalists` (the league's finalist, f/g/h) + `cap`
#            (leagues judged) open the 2026/27 test (to 31 Jan 2027) once, not before 3 Feb 2027.
#   comebacks-fetch: one `league`'s Understat goal minutes (E0, SP1, D1, I1, F1),
#            downloaded and cached (comebacks-<league>-); prints counts only, never outcomes.
#   comebacks: favourites coming back from behind (docs/lab.md, 24 Oct): eight leagues
#            pooled from the cached files, against a fair time-scaled Poisson model.
#   corner-coverage: 2025/26 corner-count coverage in all six leagues (counts only).
#   cup-corner-coverage: the cup corners model's coverage count (docs/totals.md "Cup corners
#            model"): football-data HC/AC per file, ESPN cup summaries with corner counts,
#            cup clubs with domestic corner data, plus the live corner-snapshot cost on ESPN's
#            2026/27 calendar. No fit, no score; ESPN and football-data only, no key.
#   cup-corners: the cup corners model's pre-registered walk-forward on 2024/25-2025/26 (all
#            three cups, qualifying included) and the 2026/27 clubs with a chance. No key.
#            Both cup tasks keep ESPN's corner counts in the cup-corners-* cache.
#   corner-recal: team-corner recalibration for `league` (docs/totals.md, round 12):
#            development view with 2025/26 dropped first; `reason` opens 2025/26 once.
#   markets: live market probe (team totals, alternate totals, corners; docs/totals.md),
#            all six leagues, never past `cap` credits (0 = dry run: free events list only).
#            `leagues` (e.g. E2,E3) probes only those: League One / League Two check
#            (docs/leagues.md): h2h, team corners and totals at DraftKings, Pinnacle and
#            FanDuel, a verdict per league, and football-data's HC/AC and Pinnacle coverage,
#            plus every events-list team name against football-data's clubs this season
#            (`--names`, free; the 13 Oct name check, run 38447588309).
#   espn: ESPN slugs, team names and summary shape (no key); with `leagues` (e.g. E2,E3)
#            only those, 21 days of scoreboards, names checked against football-data's clubs.
#   corner-history: historical Pinnacle team-corner prices (alternate_team_totals_corners;
#            docs/totals.md, "Historical corner prices probe"): four probe points, one events
#            and one odds call each, never past `cap` credits (0 = dry run: no calls), plus
#            the projected cost of a priced corners backtest (E0, I1, F1, 2023/24-2025/26).
#   lab-coverage: Pinnacle and xG coverage per season for `league` (counts only).
#   lab-holdout: opens the locked holdout once for `finalists` (and `stack_base`), with
#             `reason` printed and the time it was opened. No credits.
#   goalscorer: the anytime-goalscorer stage-0 live probe and 5-match pilot
#             (docs/player_props.md), never past `cap` credits (0 = no calls); prints
#             the books, margins, name matches, measures and the pre-registered verdict.
#   goal-lab: the goalscorer model improvements (docs/player_props.md section 8),
#             development seasons; `reason` opens the locked 2026/27 forward window
#             (once, logged). No credits.
#   goal-league: anytime goalscorer, round 8 (docs/player_props.md section 10): one
#             `league` (SP1, D1, I1, F1), downloading its Understat match files and saving
#             them to that league's own cache (understat-<league>-). No credits.
#   goal-leagues: all five leagues (E0 + the four caches above) scored and pooled; `reason`
#             opens the locked 2026/27 forward window once. Run goal-league per league first.
#   player-lab: the priced player shot lines (data-log) through the lab's metrics,
#             development seasons only (no credits).
#   signals:  free signals (xG form, rest, model, soft books) vs Pinnacle's early-to-close
#             move and as blend inputs (no credits).
#   band-edges: a minimum edge per price band for the match rule (docs/lab.md, "Price-band
#            edge rule", owner 20 Oct): chosen on 2019/20-2022/23, checked once on
#            2023/24-2024/25 at Pinnacle's early prices, eight leagues. No key, no credits.
#   team-totals: data-log's FanDuel team-total log, scored once enough matches settle; also
#             the round-13 test against DraftKings' main market (docs/totals.md): counts only
#             below its gate; `finalists` ("fanduel_anchor:0.05") + `after` score a frozen rule.
name: Player odds check

on:
  workflow_dispatch:
    inputs:
      task:
        description: "coverage, props, match, shots, signals, lab, lab-holdout, lab-coverage, lab-edge, lineups, totals, corners, corners2, corner-coverage, corner-recal, cup-corner-coverage, cup-corners, corner-history, comebacks-fetch, comebacks, markets, goalscorer, player-lab, goal-lab, goal-league, goal-leagues, team-totals, band-edges, inplay-probe or espn"
        type: choice
        options: [coverage, props, match, shots, signals, lab, lab-holdout, lab-coverage, lab-edge, lineups, totals, corners, corners2, corner-coverage, corner-recal, cup-corner-coverage, cup-corners, corner-history, comebacks-fetch, comebacks, markets, goalscorer, player-lab, goal-lab, goal-league, goal-leagues, team-totals, band-edges, inplay-probe, espn]
        default: coverage
      cap:
        description: "props / goalscorer / markets / corner-history: most credits to spend (0 = dry run)"
        default: "0"
      hist_dates:
        description: "props: historical dates (comma-separated ISO times)"
        default: "2026-10-03T08:00:00Z,2025-03-15T08:00:00Z"
      seasons:
        description: "match/signals: seasons to bet (start years); shots: seasons to load"
        default: "2017-2025"
      league:
        description: "lab/lab-holdout/lab-coverage/lab-edge/lineups/totals/corners/corners2/corner-recal: football-data division (E0-E3, SP1, D1, I1, F1)"
        default: "E0"
      holdout_season:
        description: "lab/lab-holdout/lab-edge: start year of the locked holdout season (blank = 2025)"
        default: ""
      reason:
        description: "lab-holdout / corners / corner-recal / goal-lab: why the holdout (goal-lab: the forward window) is opened (logged)"
        default: ""
      finalists:
        description: "lab-holdout: comma-separated candidates, e.g. a_dixon_coles,c_gbm,e_stack; corners: total=<x>,team=<y>; team-totals: the frozen rule, e.g. fanduel_anchor:0.05"
        default: ""
      stack_base:
        description: "lab-holdout: the stack's base candidate (one of the finalists)"
        default: ""
      after:
        description: "team-totals confirmation: only kickoffs after this ISO time (with finalists = the frozen rule)"
        default: ""
      leagues:
        description: "markets / espn: comma-separated leagues, e.g. E2,E3 (blank = the six; markets also prints team names vs football-data's clubs, espn reads 21 days)"
        default: ""

permissions:
  contents: read
  actions: read  # goal-lab reads the round-5 pilot's job log

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # lineups downloads ~3,400 Understat match files per league
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/player_odds_history
          key: player-odds-history-none
          restore-keys: player-odds-history-
      # Restore only (goal-league saves its own league prefix): the paid caches are never saved.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task != 'coverage' && inputs.task != 'props' && inputs.task != 'goal-league' }}
        with:
          path: data/raw
          key: raw-data-none
          restore-keys: raw-data-
      # Goalscorer leagues: each league's Understat files have their own cache prefix.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'goal-league' || inputs.task == 'comebacks-fetch' }}
        with:
          path: data/raw
          key: understat-${{ inputs.league }}-none
          restore-keys: understat-${{ inputs.league }}-
      # Favourite comebacks: each league's Understat goal files have their own prefix too.
      # The paths must match the save step exactly, or the cache version differs and misses.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'comebacks-fetch' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-${{ inputs.league }}-none
          restore-keys: comebacks-${{ inputs.league }}-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'goal-leagues' }}
        with:
          path: data/raw
          key: understat-SP1-none
          restore-keys: understat-SP1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'goal-leagues' }}
        with:
          path: data/raw
          key: understat-D1-none
          restore-keys: understat-D1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'goal-leagues' }}
        with:
          path: data/raw
          key: understat-I1-none
          restore-keys: understat-I1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'goal-leagues' }}
        with:
          path: data/raw
          key: understat-F1-none
          restore-keys: understat-F1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'comebacks' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-E0-none
          restore-keys: comebacks-E0-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'comebacks' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-SP1-none
          restore-keys: comebacks-SP1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'comebacks' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-D1-none
          restore-keys: comebacks-D1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'comebacks' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-I1-none
          restore-keys: comebacks-I1-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'comebacks' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-F1-none
          restore-keys: comebacks-F1-
      # The cup corners model: ESPN's cup scoreboards (warmed by backfill.yml's match_blends
      # and the closes download), then this task's own cache of corner counts (saved below).
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'cup-corner-coverage' || inputs.task == 'cup-corners' }}
        with:
          path: data/raw/cups/espn
          key: cup-espn-none
          restore-keys: cup-espn-
      - uses: actions/cache/restore@v4
        if: ${{ inputs.task == 'cup-corner-coverage' || inputs.task == 'cup-corners' }}
        with:
          path: |
            data/raw/cups/corners
            data/raw/cups/espn
          key: cup-corners-none
          restore-keys: cup-corners-
      - name: Run
        env:
          ODDS_API_KEY: ${{ (inputs.task == 'coverage' || inputs.task == 'props' || inputs.task == 'goalscorer' || inputs.task == 'markets' || inputs.task == 'corner-history' || inputs.task == 'inplay-probe') && secrets.ODDS_API_KEY || '' }}
          TASK: ${{ inputs.task }}
          CAP: ${{ inputs.cap }}
          HIST_DATES: ${{ inputs.hist_dates }}
          SEASONS: ${{ inputs.seasons }}
          LEAGUE: ${{ inputs.league }}
          HOLDOUT_SEASON: ${{ inputs.holdout_season }}
          REASON: ${{ inputs.reason }}
          FINALISTS: ${{ inputs.finalists }}
          STACK_BASE: ${{ inputs.stack_base }}
          AFTER: ${{ inputs.after }}
          LEAGUES: ${{ inputs.leagues }}
        run: |
          uv sync --frozen
          mkdir -p out
          HS=""
          if [ -n "$HOLDOUT_SEASON" ]; then HS="--holdout-season $HOLDOUT_SEASON"; fi
          case "$TASK" in
            coverage) uv run soccer-stats player-odds-check ;;
            props) uv run python -m soccer_stats.edge.run props --cap "$CAP" \
                     --hist-dates "$HIST_DATES" --json out/props.json ;;
            match) uv run python -m soccer_stats.edge.run match --seasons "$SEASONS" \
                     --json out/match.json ;;
            signals) uv run python -m soccer_stats.edge.run signals --seasons "$SEASONS" \
                     --json out/signals.json ;;
            lab) uv run python -m soccer_stats.lab.run --league "$LEAGUE" $HS \
                     --json out/lab_dev.json ;;
            lab-edge) uv run python -m soccer_stats.lab.run --league "$LEAGUE" $HS --edge-only \
                     --json out/lab_edge.json ;;
            lineups) uv run python -m soccer_stats.edge.lineups --league "$LEAGUE" \
                     --json out/lineups.json ;;
            totals) uv run python -m soccer_stats.edge.totals --league "$LEAGUE" \
                     --json out/totals.json ;;
            corners)
              if [ -n "$REASON" ]; then
                uv run python -m soccer_stats.edge.corners --league "$LEAGUE" --open-holdout \
                  --reason "$REASON" --finalists "$FINALISTS" --json out/corners_holdout.json
              else
                uv run python -m soccer_stats.edge.corners --league "$LEAGUE" \
                  --json out/corners.json
              fi ;;
            corners2)  # round 13 bake-off: development; reason + finalists (one candidate) + cap (leagues judged) open 2026/27
              T=$([ "$CAP" = "0" ] && echo 6 || echo "$CAP")
              uv run python -m soccer_stats.edge.corners2 --league "$LEAGUE" --reason "$REASON" \
                --finalist "$FINALISTS" --tests "$T" --json out/corners2.json ;;
            comebacks-fetch) uv run python -m soccer_stats.lab.comebacks --fetch "$LEAGUE" ;;  # counts only
            comebacks) uv run python -m soccer_stats.lab.comebacks --json out/comebacks.json ;;
            inplay-probe)  # comebacks phase 2 step 1: one live h2h call during play (1 credit)
              # hist_dates set to ONE ISO time = a historical snapshot (10 credits); the default
              # (a comma list, for props) or "live" = a live call now (1 credit)
              case "$HIST_DATES" in *,*|live|"") AT="" ;; *) AT="--at $HIST_DATES" ;; esac
              uv run python -m soccer_stats.lab.inplay_probe --league "$LEAGUE" --cap "$CAP" $AT \
                --json out/inplay.json ;;
            corner-coverage) uv run python -m soccer_stats.edge.corner_recal --coverage-only ;;
            cup-corner-coverage) uv run soccer-stats cup-corners --coverage-only \
                     --json out/cup_corner_coverage.json ;;
            cup-corners) uv run soccer-stats cup-corners --json out/cup_corners.json ;;
            corner-recal) uv run python -m soccer_stats.edge.corner_recal --league "$LEAGUE" \
                     --reason "$REASON" --json out/corner_recal.json ;;
            lab-coverage) uv run python -m soccer_stats.lab.run --league "$LEAGUE" \
                     --coverage-only --json out/lab_coverage.json ;;
            lab-holdout) uv run python -m soccer_stats.lab.run --league "$LEAGUE" $HS --open-holdout \
                     --reason "$REASON" --finalists "$FINALISTS" --stack-base "$STACK_BASE" \
                     --json out/lab_holdout.json ;;
            markets)  # blank leagues = the six (unchanged); E2,E3 = the L1/L2 check + coverage + names
              if [ -n "$LEAGUES" ]; then
                uv run python -m soccer_stats.edge.market_probe --cap "$CAP" --leagues "$LEAGUES" \
                  --coverage --names --json out/markets.json --bodies out/market_bodies
              else
                uv run python -m soccer_stats.edge.market_probe --cap "$CAP" \
                  --json out/markets.json --bodies out/market_bodies
              fi ;;
            corner-history)  # bodies cached in data/raw/corner_history, copied to the artifact
              uv run soccer-stats corner-history-probe --cap "$CAP" \
                --json out/corner_history.json
              if [ -d data/raw/corner_history ]; then cp -r data/raw/corner_history out/; fi ;;
            goalscorer) uv run soccer-stats goalscorer-pilot --cap "$CAP" \
                     --json out/goalscorer_pilot.json ;;
            goal-lab)
              curl -sSfL -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/jobs/112639640656/logs" \
                -o out/pilot.log || echo "pilot log not available"
              uv run soccer-stats goal-lab --pilot-log out/pilot.log \
                --open-forward "$REASON" --json out/goal_lab.json
              rm -f out/pilot.log ;;
            goal-league) uv run soccer-stats goal-league --league "$LEAGUE" \
                     --rows "out/rows_${LEAGUE}.csv.gz" --json "out/goal_${LEAGUE}.json" ;;
            goal-leagues)
              for L in E0 SP1 D1 I1 F1; do
                uv run soccer-stats goal-league --league "$L" --open-forward "$REASON" \
                  --rows "out/rows_${L}.csv.gz" --json "out/goal_${L}.json"
              done
              uv run soccer-stats goal-pool --rows-dir out --json out/goal_pool.json ;;
            player-lab)
              git fetch --depth=1 origin data-log
              git show FETCH_HEAD:backtest/E0_player_lines.csv.gz > out/lines.csv.gz
              git show FETCH_HEAD:backtest/E0_players.json > out/players.json
              uv run soccer-stats player-lab --lines out/lines.csv.gz \
                --players-json out/players.json --json out/player_lab.json
              rm out/lines.csv.gz out/players.json ;;
            shots) uv run python -m soccer_stats.edge.run shots --seasons "$SEASONS" \
                     --json out/shots.json ;;
            espn)  # no key: ESPN slugs, names (vs football-data's clubs), summary shape
              if [ -n "$LEAGUES" ]; then
                uv run soccer-stats espn-probe --leagues "$LEAGUES" --back 21
              else
                uv run soccer-stats espn-probe
              fi ;;
            band-edges) uv run soccer-stats backtest-band-edges --json out/band_edges.json ;;
            team-totals)  # no key: reads data-log's team-total log, scores it if enough
              git fetch --depth=1 origin data-log
              mkdir -p out/log/odds_log
              # Team-total rows and DraftKings month files (the main market); not the call record.
              for f in $(git ls-tree --name-only FETCH_HEAD odds_log/ | grep '\.jsonl$' | grep -v 'team_totals_calls_'); do
                git show "FETCH_HEAD:$f" > "out/log/odds_log/$(basename "$f")"
              done
              uv run soccer-stats team-totals-report --log-dir out/log \
                --after "$AFTER" --rule "$FINALISTS" > out/team_totals.json
              cat out/team_totals.json
              rm -rf out/log ;;
          esac
      # The cup corner counts (final matches, a few bytes each) under their own prefix.
      - uses: actions/cache/save@v4
        if: ${{ always() && (inputs.task == 'cup-corner-coverage' || inputs.task == 'cup-corners') }}
        with:
          path: |
            data/raw/cups/corners
            data/raw/cups/espn
          key: cup-corners-${{ github.run_id }}
      # Favourite comebacks: one league's Understat files (match goals and season lists).
      - uses: actions/cache/save@v4
        if: ${{ always() && inputs.task == 'comebacks-fetch' }}
        with:
          path: |
            data/raw/understat_matches
            data/raw/understat_*.json
          key: comebacks-${{ inputs.league }}-${{ github.run_id }}
      # Only goal-league saves a cache, under its own league's prefix (never raw-data-).
      - uses: actions/cache/save@v4
        if: ${{ always() && inputs.task == 'goal-league' && inputs.league != 'E0' }}
        with:
          path: data/raw
          key: understat-${{ inputs.league }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-${{ inputs.task }}${{ inputs.task == 'goal-league' && format('-{0}', inputs.league) || '' }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
