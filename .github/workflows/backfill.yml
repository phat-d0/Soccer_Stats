# Downloads historical DraftKings odds and runs the DraftKings backtest. Run by hand only
# (Actions -> "Backfill DraftKings odds" -> Run workflow); never on a schedule.
# The historical endpoint needs a paid Odds API plan. Start with a dry run.
# match_markets: research only. Runs `soccer-stats match-markets` on football-data
# (Asian handicap, O/U 2.5 and 1X2 vs Pinnacle, plus the xG signal test): no API key,
# no download from The Odds API, no push; results in the log and a 7-day artifact.
# match_blends: fits each live league's h2h blend and sigma (Blend Lean) on football-data
# and Understat (no key, no credits); pushes backtest/match_blends.json to data-log only
# from the default branch.
# estimate_month (+ cups): credit estimates only, no key, no push; `cups` adds the UEFA
# cups' cost on ESPN's calendar (cups.py).
# lean_backtest: replays Blend Lean walk-forward on Pinnacle's early prices per league,
# and the Champions League at DraftKings' bought close (data-log's UCL_closes.jsonl, never
# bought here) (no key, no credits); pushes backtest/lean_backtest.json to data-log only
# from the default branch.
# edge12_backtest: the same for the live Model 12% rule (owner, 21 Oct); pushes
# backtest/edge12_backtest.json to data-log only from the default branch.
# edge12_filters: the live Model 12% rule and two filters (model favourites only; price
# 3.00 or shorter) on Pinnacle's early prices, plus a descriptive E0 DraftKings check
# (pre-registered in docs/lab.md, owner 19 Oct). No key, no credits, never pushes;
# log + 7-day artifact.
# cup_odds: the Champions League's historical closes (owner decision, 13 Oct; lead cap
# 1,200 credits): Pinnacle and DraftKings h2h, one bulk snapshot per kickoff slot of
# ESPN's 2024/25-2025/26 calendar (`soccer-stats backfill-cup-odds`). The cap is
# max_credits; dry_run (the default) or max_credits 0 = plan only, and a dry run gets no
# key. Bodies go to the cup-odds-history-* cache; the parsed closes and call record are
# appended to data-log's odds_history/ only from the default branch and only when not a
# dry run (elsewhere: log + 7-day artifact). None of the DraftKings steps run with it.
name: Backfill DraftKings odds

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to backfill and backtest (start years, e.g. 2025 or 2023-2025)"
        default: "2025"
      max_credits:
        description: "Most credits this run may spend"
        default: "0"
      keep_credits:
        description: "Never let credits left fall below this (keeps live refreshes going)"
        default: "1500"
      dry_run:
        description: "Dry run: print snapshots and credits, spend nothing"
        type: boolean
        default: true
      print_only:
        description: "Only print the backtest from cached odds (no API key, no download, no push)"
        type: boolean
        default: false
      match_markets:
        description: "Research: AH, O/U 2.5 and 1X2 vs Pinnacle on football-data (no key, no push)"
        type: boolean
        default: false
      markets_seasons:
        description: "match_markets: seasons to predict (start years)"
        default: "2017-2025"
      match_blends:
        description: "Fit each live league's h2h blend and sigma for Blend Lean (no key; saved to data-log from the default branch only)"
        type: boolean
        default: false
      lean_backtest:
        description: "Replay Blend Lean on Pinnacle's early prices per league (no key; saved to data-log from the default branch only)"
        type: boolean
        default: false
      edge12_backtest:
        description: "Replay Model 12% on Pinnacle's early prices per league, the Champions League at the close (no key; saved to data-log from the default branch only)"
        type: boolean
        default: false
      edge12_filters:
        description: "Research: the live 12% rule with two filters on Pinnacle's early prices + E0 DraftKings check (no key, no push)"
        type: boolean
        default: false
      estimate_month:
        description: "Only estimate Odds API credits per league and month (YYYY-MM or YYYY-MM,YYYY-MM,...; plus team-total and team-corner snapshots; League One/Two's corners priced apart; no key, no push)"
        default: ""
      cups:
        description: "With estimate_month: also cost the UEFA cups on ESPN's 2024/25-2025/26 calendar (no key, no push; log + 7-day artifact)"
        type: boolean
        default: false
      cup_odds:
        description: "Champions League historical closes (Pinnacle + DraftKings h2h; cap = max_credits; dry_run or 0 = plan only, no key; saved to data-log from the default branch only)"
        type: boolean
        default: false
      cup_seasons:
        description: "cup_odds, and estimate_month + cups: seasons (start years, comma-separated)"
        default: "2024,2025"

permissions:
  contents: write # writes the backtest summary to the data-log branch

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Historical snapshots are kept in their own cache, separate from the scheduled
      # build's, and are not committed (check The Odds API's terms before publishing them).
      - uses: actions/cache@v4
        if: ${{ !inputs.cup_odds && !inputs.print_only && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && !inputs.edge12_backtest && !inputs.edge12_filters && inputs.estimate_month == '' }}
        with:
          path: data/raw/odds_history
          key: odds-history-${{ github.run_id }}
          restore-keys: odds-history-

      # Print-only: restore the cached odds (never saves or deletes a cache), run the
      # backtest without the API key so it can't spend credits, and print the results.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.print_only || inputs.match_markets || inputs.match_blends || inputs.lean_backtest || inputs.edge12_backtest || inputs.edge12_filters || inputs.estimate_month != '' }}
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - uses: actions/cache/restore@v4
        if: ${{ !inputs.cup_odds && inputs.print_only && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && !inputs.edge12_backtest && !inputs.edge12_filters && inputs.estimate_month == '' }}
        with:
          path: data/raw/odds_history
          key: odds-history-${{ github.run_id }}
          restore-keys: odds-history-

      # Champions League historical closes (owner decision, 13 Oct; docs/leagues.md
      # "Champions League: historical closes download"). Bodies and ESPN's calendar days
      # live in their own cache, restored here and saved even when a later step fails, so
      # a paid body is never lost before its rows reach data-log.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.cup_odds }}
        with:
          path: |
            data/raw/cup_odds
            data/raw/cups/espn
          key: cup-odds-history-${{ github.run_id }}
          restore-keys: cup-odds-history-

      # The durable copy: slots already held on data-log are never bought again, even if
      # the cache above was evicted. Fails the job, before any call, if data-log can't be read.
      - name: Read the cup closes already held on data-log
        if: ${{ inputs.cup_odds }}
        run: |
          mkdir -p "$RUNNER_TEMP/cup_state"
          git fetch --depth=1 origin data-log
          for f in $(git ls-tree --name-only FETCH_HEAD odds_history/ | grep -E '_close(s|_calls)\.jsonl$'); do
            git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/cup_state/$(basename "$f")"
          done
          ls -l "$RUNNER_TEMP/cup_state"

      - name: Download the Champions League closes (capped)
        if: ${{ inputs.cup_odds }}
        env:
          # The key only for a paid run; a dry run has none, so it can't spend.
          ODDS_API_KEY: ${{ (inputs.cup_odds && !inputs.dry_run) && secrets.ODDS_API_KEY || '' }}
        run: |
          uv sync --frozen
          mkdir -p out data/raw/cup_odds data/raw/cups/espn
          cap="${{ inputs.max_credits }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then cap=0; fi
          uv run soccer-stats backfill-cup-odds --cup UCL --seasons "${{ inputs.cup_seasons }}" \
            --cap "$cap" --state "$RUNNER_TEMP/cup_state" --pending out/cup_odds \
            --json out/cup_odds.json

      - uses: actions/cache/save@v4
        if: ${{ inputs.cup_odds && always() }}
        with:
          path: |
            data/raw/cup_odds
            data/raw/cups/espn
          key: cup-odds-history-${{ github.run_id }}

      - name: Save the cup closes to data-log (default branch only)
        if: ${{ inputs.cup_odds && !inputs.dry_run }}
        run: |
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Not the default branch: printed only, nothing pushed to data-log."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            git fetch --depth=1 origin data-log
            git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            uv run soccer-stats log-cup-odds --cup UCL --pending out/cup_odds --log-dir ../log
            git -C ../log add odds_history
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "Champions League historical closes"
            if git -C ../log push origin data-log; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.cup_odds && always() }}
        with:
          name: cup-odds
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Credit estimate per league (print only)
        if: ${{ inputs.estimate_month != '' }}
        run: |
          uv sync --frozen
          months="${{ inputs.estimate_month }}"
          # Every football-data registry league per month listed (all eight live since 13 Oct).
          for m in ${months//,/ }; do uv run soccer-stats estimate-credits --month "$m"; done
          # Team-total snapshots (docs/totals.md): an estimate only, no key, no calls.
          uv run soccer-stats estimate-team-totals --months "$months"
          # Pinnacle team-corner snapshots, six leagues (owner's live test, 10 Oct), plus
          # League One and League Two priced apart (Pinnacle quotes no team corners there; not
          # counted, not fetched).
          uv run soccer-stats estimate-corners --months "$months" --extra-leagues E2,E3

      # The UEFA cups (owner's request, 12 Oct; docs/leagues.md "European cups"): ESPN's
      # free calendar replayed under the matchday rule, snapshot and historical costs, and
      # football-data team coverage. No key, no credits, no push.
      - name: European cups cost estimate (print only)
        if: ${{ inputs.estimate_month != '' && inputs.cups }}
        run: |
          uv sync --frozen
          mkdir -p out
          # cup_seasons picks the calendars (default 2024,2025; 2026 = this season's, e.g.
          # the Champions League's live cost for Oct-Dec 2026).
          uv run soccer-stats estimate-cups --seasons "${{ inputs.cup_seasons }}" --json out/cups.json

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.estimate_month != '' && inputs.cups && always() }}
        with:
          name: cups-estimate
          path: out/cups.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Match markets vs Pinnacle (research, print only)
        if: ${{ inputs.match_markets && inputs.estimate_month == '' }}
        run: |
          uv sync --frozen
          mkdir -p out
          uv run soccer-stats match-markets --seasons "${{ inputs.markets_seasons }}" \
            --json out/match_markets.json

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.match_markets && always() }}
        with:
          name: match-markets
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      # The Champions League's blend (owner, 13 Oct) needs every European result since
      # 2022 from ESPN's free scoreboards: the days the closes download cached, then this
      # step's own cache (saved below; publish.yml restores it, so the live model starts warm).
      - uses: actions/cache/restore@v4
        if: ${{ inputs.match_blends && !inputs.match_markets && inputs.estimate_month == '' }}
        with:
          path: |
            data/raw/cup_odds
            data/raw/cups/espn
          key: cup-odds-history-${{ github.run_id }}
          restore-keys: cup-odds-history-

      - uses: actions/cache/restore@v4
        if: ${{ inputs.match_blends && !inputs.match_markets && inputs.estimate_month == '' }}
        with:
          path: data/raw/cups/espn
          key: cup-espn-${{ github.run_id }}
          restore-keys: cup-espn-

      # Blend Lean (owner, 10 Oct): each live league's h2h blend of the model and Pinnacle's
      # margin-free close, with sigma, from football-data and Understat only (no key, no
      # credits); the Champions League's from the cross-league model beside data-log's
      # bought closes (odds_history/UCL_closes.jsonl). Saved to data-log
      # (backtest/match_blends.json) only from the default branch; elsewhere it prints and
      # uploads a 7-day artifact.
      - name: Fit the per-league match blends
        if: ${{ inputs.match_blends && !inputs.match_markets && inputs.estimate_month == '' }}
        run: |
          uv sync --frozen
          mkdir -p out data/raw/cups/espn
          git fetch --depth=1 origin data-log
          git show FETCH_HEAD:odds_history/UCL_closes.jsonl > out/UCL_closes.jsonl 2>/dev/null ||
            { rm -f out/UCL_closes.jsonl; echo "No Champions League closes on data-log"; }
          uv run soccer-stats fit-match-blends --cup-closes out/UCL_closes.jsonl \
            --json out/match_blends.json
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Not the default branch: printed only, nothing pushed to data-log."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            git fetch --depth=1 origin data-log
            git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            mkdir -p ../log/backtest
            cp out/match_blends.json ../log/backtest/match_blends.json
            git -C ../log add backtest/match_blends.json
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "Per-league match blends"
            if git -C ../log push origin data-log; then exit 0; fi
          done
          exit 1

      - uses: actions/cache/save@v4
        if: ${{ inputs.match_blends && !inputs.match_markets && inputs.estimate_month == '' && always() }}
        with:
          path: data/raw/cups/espn
          key: cup-espn-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.match_blends && always() }}
        with:
          name: match-blends
          path: out/match_blends.json
          retention-days: 7
          if-no-files-found: ignore

      # Blend Lean backtest (owner, 10 Oct): the Lean rule replayed walk-forward on
      # Pinnacle's early prices in every live league, plus E0_dk.json's DraftKings tiers
      # (read from data-log, never written by this step). Football-data and Understat only:
      # no key, no credits. Saved to data-log (backtest/lean_backtest.json) only from the
      # default branch; elsewhere it prints and uploads a 7-day artifact.
      # The Champions League's replay at the close (owner, 21 Oct) needs ESPN's European
      # results, from the cache fit-match-blends saves (restored only), and data-log's
      # bought closes (read only; nothing is ever bought here).
      - uses: actions/cache/restore@v4
        if: ${{ (inputs.lean_backtest || inputs.edge12_backtest) && !inputs.match_markets && !inputs.match_blends && inputs.estimate_month == '' }}
        with:
          path: data/raw/cups/espn
          key: cup-espn-${{ github.run_id }}
          restore-keys: cup-espn-

      - name: Blend Lean backtest on Pinnacle's early prices
        if: ${{ inputs.lean_backtest && !inputs.match_markets && !inputs.match_blends && inputs.estimate_month == '' }}
        run: |
          uv sync --frozen
          mkdir -p out data/raw/cups/espn
          git fetch --depth=1 origin data-log
          git show FETCH_HEAD:backtest/E0_dk.json > out/E0_dk.json 2>/dev/null || rm -f out/E0_dk.json
          git show FETCH_HEAD:odds_history/UCL_closes.jsonl > out/UCL_closes.jsonl 2>/dev/null ||
            { rm -f out/UCL_closes.jsonl; echo "No Champions League closes on data-log"; }
          uv run soccer-stats backtest-lean --dk-file out/E0_dk.json \
            --cup-closes out/UCL_closes.jsonl --json out/lean_backtest.json
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Not the default branch: printed only, nothing pushed to data-log."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            git fetch --depth=1 origin data-log
            git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            mkdir -p ../log/backtest
            cp out/lean_backtest.json ../log/backtest/lean_backtest.json
            git -C ../log add backtest/lean_backtest.json
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "Blend Lean backtest on Pinnacle early prices"
            if git -C ../log push origin data-log; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.lean_backtest && always() }}
        with:
          name: lean-backtest
          path: out/lean_backtest.json
          retention-days: 7
          if-no-files-found: ignore

      # Model 12% backtest (owner, 21 Oct): the live 12% rule replayed per league on
      # Pinnacle's early prices, the Champions League at DraftKings' bought close; E0_dk.json
      # is read (named beside it), never written. No key, no credits. Saved to data-log
      # (backtest/edge12_backtest.json) only from the default branch; elsewhere it prints and
      # uploads a 7-day artifact.
      - name: Model 12% backtest on Pinnacle's early prices
        if: ${{ inputs.edge12_backtest && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && inputs.estimate_month == '' }}
        run: |
          uv sync --frozen
          mkdir -p out data/raw/cups/espn
          git fetch --depth=1 origin data-log
          git show FETCH_HEAD:backtest/E0_dk.json > out/E0_dk.json 2>/dev/null || rm -f out/E0_dk.json
          git show FETCH_HEAD:odds_history/UCL_closes.jsonl > out/UCL_closes.jsonl 2>/dev/null ||
            { rm -f out/UCL_closes.jsonl; echo "No Champions League closes on data-log"; }
          uv run soccer-stats backtest-edge12 --dk-file out/E0_dk.json \
            --cup-closes out/UCL_closes.jsonl --json out/edge12_backtest.json
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Not the default branch: printed only, nothing pushed to data-log."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            git fetch --depth=1 origin data-log
            git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            mkdir -p ../log/backtest
            cp out/edge12_backtest.json ../log/backtest/edge12_backtest.json
            git -C ../log add backtest/edge12_backtest.json
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "Model 12% backtest on Pinnacle early prices"
            if git -C ../log push origin data-log; then exit 0; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.edge12_backtest && always() }}
        with:
          name: edge12-backtest
          path: out/edge12_backtest.json
          retention-days: 7
          if-no-files-found: ignore

      # Model 12% filters (owner, 19 Oct; docs/lab.md): the cached DraftKings snapshots for the
      # descriptive E0 check are restored only (never saved or deleted), with no key.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.edge12_filters }}
        with:
          path: data/raw/odds_history
          key: odds-history-${{ github.run_id }}
          restore-keys: odds-history-

      - name: Model 12% filters on Pinnacle's early prices (research, print only)
        if: ${{ inputs.edge12_filters && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && inputs.estimate_month == '' }}
        run: |
          uv sync --frozen
          mkdir -p out
          uv run soccer-stats backtest-edge12-filters --json out/edge12_filters.json

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.edge12_filters && always() }}
        with:
          name: edge12-filters
          path: out/edge12_filters.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Backtest from cached odds (print only)
        if: ${{ !inputs.cup_odds && inputs.print_only && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && !inputs.edge12_backtest && !inputs.edge12_filters && inputs.estimate_month == '' }}
        run: |
          uv sync --frozen
          uv run soccer-stats backtest-dk --seasons "${{ inputs.seasons }}"

      - name: Download historical odds
        if: ${{ !inputs.cup_odds && !inputs.print_only && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && !inputs.edge12_backtest && !inputs.edge12_filters && inputs.estimate_month == '' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          uv sync --frozen
          uv run soccer-stats backfill-odds --seasons "${{ inputs.seasons }}" \
            --max-credits "${{ inputs.max_credits }}" --keep-credits "${{ inputs.keep_credits }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Run the DraftKings backtest and save it for the app
        if: ${{ !inputs.cup_odds && !inputs.dry_run && !inputs.print_only && !inputs.match_markets && !inputs.match_blends && !inputs.lean_backtest && !inputs.edge12_backtest && !inputs.edge12_filters && inputs.estimate_month == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            git fetch --depth=1 origin data-log
            git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            uv run soccer-stats backtest-dk --seasons "${{ inputs.seasons }}" \
              --out "../log/backtest/E0_dk_trades.csv" --log-dir ../log
            git -C ../log add -A backtest
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "DraftKings backtest ${{ inputs.seasons }}"
            if git -C ../log push origin data-log; then exit 0; fi
          done
          exit 1
