# Model tuning programme (docs/lab.md "Model tuning programme"; Research lab 2, owner via the
# lead, 8 Nov). Development only: 2019/20-2023/24 scored, 2024/25 locked (lab.harness.Holdout).
# One job per league, then a pool job. No API key, no credits, never pushes. Results in the
# log (TUNING_<PHASE>_JSON) and a 7-day artifact.
#   phase=bias: phase 1, bias vs variance (lab/tuning_bias.py).
#   phase=scorecard: model evaluation stage 2, the scorecards (lab/model_scorecard.py;
#   descriptive; the pool prints lab/model_scorecard.json in base64 chunks).
#   phase=judged: the frozen 2025/26 judged read of the model settings (run once; docs/lab.md).
#   phase=xg-2025: 2025/26 Understat coverage per league (counts only, for the judged read).
#   phase=grid-ridge: block R2, the ratings ridge on a wider grid (the judged read's choice).
#   phase=grid-rho: phase 3's rho block alone (DixonColes.rho_option).
#   phase=grid: phase 3, the nested grid search on the never-tuned settings (lab/tuning_grid.py).
#   phase=ceiling: phase 2, the ceiling analysis (lab/tuning_ceiling.py); reads the paid
#   odds-history cache (restore only, with the archive fallback) for the line-shop stages.
name: Model tuning

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "bias = phase 1, bias vs variance; ceiling = phase 2, the ceiling analysis; grid = phase 3, the grid search; grid-rho = phase 3's rho block; grid-ridge = the wider ridge block R2; xg-2025 = 2025/26 xG coverage (counts); judged = the frozen 2025/26 read (run once); scorecard = model evaluation stage 2 (descriptive)"
        type: choice
        options: [bias, ceiling, grid, grid-rho, grid-ridge, xg-2025, judged, scorecard]
        default: bias

permissions:
  contents: read

jobs:
  league:
    runs-on: ubuntu-24.04  # pinned 24 Oct: ubuntu-latest moved to 26.04
    timeout-minutes: 240  # phase 3: up to 45 walk-forwards per league
    strategy:
      fail-fast: false
      matrix:
        league: [E0, SP1, D1, I1, F1, E1, E2, E3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-data-none
          restore-keys: raw-data-
      # The last good Understat league files (xg.GOOD_DIR), with the archived old seasons.
      - uses: actions/cache/restore@v4
        with:
          path: data/understat_good
          key: xg-good-none
          restore-keys: xg-good-
      # Rebuilt from the permanent archive when the cache missed (cache_archive.ARCHIVED_FREE).
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: xg-good
      - uses: actions/cache/restore@v4
        if: ${{ contains(fromJSON('["SP1","D1","I1","F1"]'), matrix.league) }}
        with:
          path: data/raw
          key: understat-${{ matrix.league }}-none
          restore-keys: understat-${{ matrix.league }}-
      # Paid odds (restore only): the ten-book history for phase 2's line-shop stages.
      - uses: actions/cache/restore@v4
        if: ${{ inputs.phase == 'ceiling' }}
        with:
          path: data/raw/odds_history
          key: odds-history-none
          restore-keys: odds-history-
      - name: Rebuild the paid odds-history cache from the archive if it missed
        if: ${{ inputs.phase == 'ceiling' }}
        uses: ./.github/actions/paid-archive-restore
        with:
          name: odds-history
      - name: Run the phase for one league
        env:
          LEAGUE: ${{ matrix.league }}
          PHASE: ${{ inputs.phase }}
        run: |
          uv sync --frozen
          mkdir -p out
          case "$PHASE" in
            bias) uv run python -m soccer_stats.lab.tuning_bias --league "$LEAGUE" --out out ;;
            ceiling) uv run python -m soccer_stats.lab.tuning_ceiling --league "$LEAGUE" --out out ;;
            grid) uv run python -m soccer_stats.lab.tuning_grid --league "$LEAGUE" --out out ;;
            grid-rho) uv run python -m soccer_stats.lab.tuning_grid --league "$LEAGUE" --out out \
                        --blocks P ;;
            xg-2025) uv run python -m soccer_stats.lab.tuning_base --xg-check 2025 --league "$LEAGUE" ;;
            judged) uv run python -m soccer_stats.lab.tuning_judged --league "$LEAGUE" --out out ;;
            scorecard) uv run python -m soccer_stats.lab.model_scorecard --league "$LEAGUE" --out out ;;
            grid-ridge) uv run python -m soccer_stats.lab.tuning_grid --league "$LEAGUE" --out out \
                        --blocks R2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tuning-${{ inputs.phase }}-${{ matrix.league }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  pool:
    needs: league
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: tuning-${{ inputs.phase }}-*
          path: in
      - name: Pool the leagues
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          uv sync --frozen
          mkdir -p out
          case "$PHASE" in
            xg-2025) echo "counts are in the league jobs' logs (XG_COVERAGE)" ;;
            judged) uv run python -m soccer_stats.lab.tuning_judged --pool in --out out ;;
            scorecard) uv run python -m soccer_stats.lab.model_scorecard --pool in --out out ;;
            bias) uv run python -m soccer_stats.lab.tuning_bias --pool in --out out ;;
            ceiling) uv run python -m soccer_stats.lab.tuning_ceiling --pool in --out out ;;
            grid|grid-rho|grid-ridge) uv run python -m soccer_stats.lab.tuning_grid --pool in --out out ;;
          esac
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tuning-${{ inputs.phase }}-pooled
          path: out/
          retention-days: 7
          if-no-files-found: ignore
