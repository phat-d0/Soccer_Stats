# Rebuilds the phone app (model + predictions) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish app

on:
  schedule:
    # 06:07, 12:07 and 18:07 UTC: picks up overnight results, midday odds, evening odds.
    - cron: "7 6,12,18 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    paths: ["src/**", "web/**", ".github/workflows/publish.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Finished seasons never change, so keep downloaded data between runs.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - name: Build site
        run: |
          uv sync --frozen
          uv run soccer-stats publish --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
