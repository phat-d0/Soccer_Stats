# Rebuilds the phone app (model + predictions) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish app

on:
  schedule:
    # Every hour, plus every 15 minutes from 10:00 to 21:59 UTC when matches, team news
    # and odds moves happen. (GitHub may start scheduled runs a few minutes late.)
    - cron: "7 * * * *"
    - cron: "22,37,52 10-21 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    # Only the default branch publishes: a push to a team branch must never write
    # data-log or try to deploy.
    branches: [claude/soccer-stats-scaffold]
    paths: ["src/**", "web/**", ".github/workflows/publish.yml"]

permissions:
  contents: write # push team-news history to the data-log branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Finished seasons never change, so keep downloaded data between runs.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      # Player odds and trades stay off until the player model beats its baseline
      # (backtest-players writes that result to the data-log branch).
      - name: Read the player-model gate
        continue-on-error: true
        run: |
          git fetch --depth=1 origin data-log &&
            git show FETCH_HEAD:backtest/E0_players.json > "$RUNNER_TEMP/players_gate.json" ||
            echo "No player-model result yet: player odds stay off"

      # The match blend (model + DraftKings' price) fitted by backtest-dk; without it the
      # value pick and paper trades use the model's own chances.
      - name: Read the match blend
        continue-on-error: true
        run: |
          git fetch --depth=1 origin data-log &&
            git show FETCH_HEAD:backtest/E0_dk.json > "$RUNNER_TEMP/dk_backtest.json" ||
            echo "No DraftKings backtest yet: match edges use the raw model"

      - name: Build site
        env:
          PLAYER_GATE_FILE: ${{ runner.temp }}/players_gate.json
          DK_BACKTEST_FILE: ${{ runner.temp }}/dk_backtest.json
          # DraftKings odds via the-odds-api.com; empty if the secret isn't set yet.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Free allowance assumed to reset on the 5th (key created 5 Oct); the code
          # learns the real day automatically the first time credits go back up.
          ODDS_API_RESET_DAY: "5"
        run: |
          uv sync --frozen
          uv run soccer-stats publish --out _site

      # Paper trades, team-news history and the DraftKings odds log live on the data-log
      # branch. The step runs before the Pages upload and is safe to repeat: a trade is
      # opened at most once, a logged price is never written twice, and on a push race
      # the step starts again from the latest data-log. Only the default branch writes
      # there (a dispatch on another branch builds without the ledger).
      - name: Paper trades, team news and odds log (data-log branch)
        continue-on-error: true # the site still publishes; the Portfolio tab says why
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            uv run soccer-stats paper --site _site  # no ledger off the default branch
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          checkout_log() {
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            if git fetch --depth=1 origin data-log; then
              git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            elif git ls-remote --exit-code --heads origin data-log; then
              echo "data-log exists but couldn't be fetched"; return 1
            else
              git worktree add --detach ../log && git -C ../log switch --orphan data-log
            fi
          }
          for attempt in 1 2 3; do
            if ! checkout_log; then
              uv run soccer-stats paper --site _site  # no ledger: opens nothing, says why
              exit 0
            fi
            uv run soccer-stats log-news --snapshot _site/news_snapshot.json --log-dir ../log/fpl_news
            uv run soccer-stats log-odds --site _site --log-dir ../log
            uv run soccer-stats paper --site _site --log-dir ../log
            git -C ../log add -A
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "Data log $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C ../log push origin data-log; then exit 0; fi
            echo "data-log moved on; retrying from the latest ($attempt)"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
