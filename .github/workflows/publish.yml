# Rebuilds the phone app (model + predictions) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish app

on:
  schedule:
    # Every hour, plus every 15 minutes from 10:00 to 21:59 UTC when matches, team news
    # and odds moves happen. (GitHub may start scheduled runs a few minutes late.)
    - cron: "7 * * * *"
    - cron: "22,37,52 10-21 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    paths: ["src/**", "web/**", ".github/workflows/publish.yml"]

permissions:
  contents: write # push team-news history to the data-log branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Finished seasons never change, so keep downloaded data between runs.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - name: Build site
        env:
          # DraftKings odds via the-odds-api.com; empty if the secret isn't set yet.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Free allowance assumed to reset on the 5th (key created 5 Oct); the code
          # learns the real day automatically the first time credits go back up.
          ODDS_API_RESET_DAY: "5"
        run: |
          uv sync --frozen
          uv run soccer-stats publish --out _site

      # FPL doesn't keep past injury news, so record changes as they happen; the
      # history lets player adjustments be backtested later.
      - name: Log team news to data-log branch
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin data-log; then
            git worktree add ../log FETCH_HEAD
            git -C ../log switch -c data-log
          else
            git worktree add --detach ../log
            git -C ../log switch --orphan data-log
          fi
          uv run soccer-stats log-news --snapshot _site/news_snapshot.json --log-dir ../log/fpl_news
          git -C ../log add fpl_news
          if ! git -C ../log diff --cached --quiet; then
            git -C ../log commit -q -m "Team news $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C ../log push origin data-log
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
