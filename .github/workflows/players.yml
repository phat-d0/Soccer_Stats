# Tests the player shot model (stage 1, no odds or credits) every Monday, and on demand.
# Optionally downloads historical FanDuel player odds first for the priced backtest
# (stage 2; about 20 credits per match per snapshot). Results go to the data-log branch,
# where the app and the scheduled build read them: player odds and player paper trades
# switch on only when the model beats its season-average baseline.
name: Player model

on:
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to test (start years; now = the season in progress, left out until it has played matches)"
        default: "2023-now"
      odds_seasons:
        description: "Seasons of historical player odds to download (blank = none)"
        default: ""
      max_credits:
        description: "Most credits the player-odds download may spend"
        default: "0"
      dry_run:
        description: "Dry run for the player-odds download (spend nothing)"
        type: boolean
        default: true
      goal_forward_reason:
        description: "Opens the goalscorer forward window (from 2026-10-10) in E0_goals.json; blank keeps it locked"
        default: ""

permissions:
  contents: write

concurrency:
  group: players
  cancel-in-progress: false

jobs:
  players:
    runs-on: ubuntu-24.04  # pinned 24 Oct: ubuntu-latest moved to 26.04 (Python 3.14, no Playwright Chromium)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Shares the scheduled build's cache, so the Understat match files downloaded
      # here are there for live player lines too.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      # Paid lines: restored here, saved right after the download, even when it fails.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/player_odds_history
          key: player-odds-history-${{ github.run_id }}
          restore-keys: player-odds-history-

      # Paid odds: if the cache missed, rebuild it from the permanent archive before
      # anything can buy (docs/caches.md).
      - name: Rebuild the paid player-odds-history cache from the archive if it missed
        uses: ./.github/actions/paid-archive-restore
        with:
          name: player-odds-history

      - name: Download historical player odds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.odds_seasons != '' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          uv sync --frozen
          uv run soccer-stats backfill-player-odds --seasons "${{ inputs.odds_seasons }}" \
            --max-credits "${{ inputs.max_credits }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      # Every run (as before), so a copy rebuilt from the archive heals the cache.
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: data/raw/player_odds_history
          key: player-odds-history-${{ github.run_id }}

      - name: Test the player model and save the result
        env:
          GOAL_FORWARD_REASON: ${{ inputs.goal_forward_reason || '' }}
        run: |
          uv sync --frozen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SEASONS="${{ inputs.seasons || '2023-now' }}"
          for attempt in 1 2 3; do
            git worktree remove --force ../log 2>/dev/null || rm -rf ../log
            git worktree prune
            git fetch --depth=1 origin data-log
            git worktree add --detach ../log FETCH_HEAD && git -C ../log switch -C data-log
            uv run soccer-stats backtest-players --seasons "$SEASONS" \
              --out ../log/backtest/E0_player_trades.csv --log-dir ../log \
              --goal-forward-reason "$GOAL_FORWARD_REASON"
            git -C ../log add -A backtest
            if git -C ../log diff --cached --quiet; then exit 0; fi
            git -C ../log commit -q -m "Player model $SEASONS ($(date -u +%F))"
            if git -C ../log push origin data-log; then exit 0; fi
          done
          exit 1

  # Archive right after a purchase (owner, 28 Oct: "save the api data permanently"): a
  # paid run on the default branch dispatches caches.yml once this job's caches are saved
  # (a job that needs it starts after its post-job cache saves), so a bought player line reaches the
  # release within minutes, not at the next twice-weekly run (docs/caches.md). Caches
  # saved on another branch are invisible to caches.yml: paid fetches run from the
  # default branch.
  archive:
    needs: players
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && github.event_name == 'workflow_dispatch' && inputs.odds_seasons != '' && !inputs.dry_run && inputs.max_credits != '0' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write # dispatch caches.yml
    steps:
      - name: Dispatch the paid-odds archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run caches.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f archive=true
