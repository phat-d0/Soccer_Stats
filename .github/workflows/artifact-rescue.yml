# One-off (lead, 8 Nov 2026): keep the 1 Nov goalscorer artifacts for good.
# Step 1 (run 42476536162) copied the 1 Nov artifacts, the only copies of the scored rows
# built from SP1/D1/I1/F1's Understat match files, into artifact 13615572896 (90 days).
# Step 2 (this version) puts that artifact's zip on the release paid-odds-archive as
# goalscorer-1nov-rescued.zip, never replacing an asset of that name, and prints its
# sha256 and size for the repo's archive/extra_assets.json, which caches.yml's verify
# checks. Nothing is read or joined; no key, no credits, never pushes.
name: Artifact rescue
on:
  push:
    branches: [team/player-props-artifact-rescue]
    paths: [.github/workflows/artifact-rescue.yml]
permissions:
  actions: read
  contents: write # the release asset only
jobs:
  rescue:
    runs-on: ubuntu-24.04
    steps:
      - name: Put the rescued artifact on the archive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=goalscorer-1nov-rescued.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13615572896/zip" > "$asset"
          unzip -l "$asset" | tail -3
          echo "ASSET $asset bytes $(stat -c %s "$asset") sha256 $(sha256sum "$asset" | cut -d' ' -f1)"
          if gh release view paid-odds-archive -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            echo "$asset is on the release already: left as it is"
          else
            gh release upload paid-odds-archive "$asset" -R "$GITHUB_REPOSITORY"
          fi
          gh release download paid-odds-archive -R "$GITHUB_REPOSITORY" -p "$asset" -D back
          echo "BACK bytes $(stat -c %s "back/$asset") sha256 $(sha256sum "back/$asset" | cut -d' ' -f1)"
          unzip -p "back/$asset" SHA256SUMS | head -30
