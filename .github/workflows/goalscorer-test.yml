# Priced goalscorer test (docs/player_props.md §16), step 3: the 2025/26 development read.
# One job per league joins B's 2025/26 walk-forward chances (starters, lineup known) to the
# anytime-goalscorer prices player_goal_backfill cached (paid player-odds-history cache,
# restore only); a pooling job applies §16's volume rule for T (largest of 5/8/12/16/20%
# with at least 0.3 bets a match, else 5%) and prints development-only descriptive numbers.
# No API key, no credits, never pushes. Results in the log (GOALSCORER_DEV_JSON) and a
# 7-day artifact.
name: Goalscorer priced test

on:
  workflow_dispatch:
    inputs:
      design:
        description: "dev = the 2025/26 development read (sets T only)"
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read

jobs:
  league:
    runs-on: ubuntu-24.04  # pinned 24 Oct: ubuntu-latest moved to 26.04
    timeout-minutes: 150  # a league's Understat files and walk-forward refits
    strategy:
      fail-fast: false
      matrix:
        league: [E0, SP1, D1, I1, F1]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Free data first (restore only), then the paid prices on top.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-data-none
          restore-keys: raw-data-
      # The last good Understat league files (xg.GOOD_DIR, publish.yml saves them): a stale
      # raw-data cache's bad Understat file is replaced from here before it's used or saved.
      - uses: actions/cache/restore@v4
        with:
          path: data/understat_good
          key: xg-good-none
          restore-keys: xg-good-
      # Rebuilt from the permanent archive when the cache missed (lead, 7 Nov; cache_archive.ARCHIVED_FREE).
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: xg-good
      # Understat match files (lead, 8 Nov): five shards, each saved by a run that worked on
      # that league; restored together, they hold every file any run kept. Archived
      # (cache_archive.ARCHIVED_FREE) and rebuilt from the archive when a shard missed.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/understat_matches
          key: understat-E0-none
          restore-keys: understat-E0-
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: understat-E0
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/understat_matches
          key: understat-SP1-none
          restore-keys: understat-SP1-
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: understat-SP1
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/understat_matches
          key: understat-D1-none
          restore-keys: understat-D1-
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: understat-D1
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/understat_matches
          key: understat-I1-none
          restore-keys: understat-I1-
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: understat-I1
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/understat_matches
          key: understat-F1-none
          restore-keys: understat-F1-
      - uses: ./.github/actions/paid-archive-restore
        continue-on-error: true # free data: a failed rebuild never stops the job
        with:
          name: understat-F1
      - name: Count the Understat match files restored (a save never keeps fewer)
        run: echo "UM_BEFORE=$(find data/raw/understat_matches -type f -name '*.json' 2>/dev/null | wc -l)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: data/raw/player_odds_history
          key: player-odds-history-none
          restore-keys: player-odds-history-
      - name: Rebuild the paid player-odds-history cache from the archive if it missed
        uses: ./.github/actions/paid-archive-restore
        with:
          name: player-odds-history
      - name: Join B's chances to the prices
        env:
          LEAGUE: ${{ matrix.league }}
        run: |
          uv sync --frozen
          mkdir -p out
          uv run soccer-stats goalscorer-dev --league "$LEAGUE" --out "out/judged_${LEAGUE}.csv.gz"
      # Saved only when this run added match files: never a copy with fewer files than
      # were restored, and from the default branch only (a branch's caches are invisible elsewhere).
      - name: Keep the Understat match files only if this run added some
        id: um
        if: ${{ always() }}
        run: |
          after=$(find data/raw/understat_matches -type f -name '*.json' 2>/dev/null | wc -l)
          before=${UM_BEFORE:-0}
          echo "Understat match files: $before restored, $after now"
          if [ "$after" -gt "$before" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "Not saved: no new match files"
          fi
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.um.outputs.save == 'true' && github.ref == 'refs/heads/claude/soccer-stats-scaffold' }}
        with:
          path: data/raw/understat_matches
          key: understat-${{ matrix.league }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: goalscorer-dev-${{ matrix.league }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  pool:
    needs: league
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: goalscorer-dev-*
          path: out
      - name: T by the volume rule, then the development description
        run: |
          uv sync --frozen
          uv run soccer-stats goalscorer-dev-pool --dir out --json out/goalscorer_dev.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: goalscorer-dev-pooled
          path: out/goalscorer_dev.json
          retention-days: 7
          if-no-files-found: ignore
